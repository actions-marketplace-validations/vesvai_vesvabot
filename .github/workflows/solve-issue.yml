name: Vesvabot Solve Issue

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  solve:
    if: github.event.label.name == 'vesvabot'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run vesvabot
        uses: vesvabot/vesvabot@v1
        with:
          mode: solve-issue
          token: ${{ secrets.GITHUB_TOKEN }}
          llm-provider: anthropic
          llm-model: ${{ vars.VESVABOT_MODEL }}
          llm-api-key: ${{ secrets.VESVABOT_API_KEY }}
          prompt-file: .github/prompts/solve-issue.md
          skills-dir: .github/prompts
          issue-number: ${{ github.event.issue.number }}
          branch-prefix: vesvabot
          base-branch: main
          max-iterations: '80'
          timeout-minutes: '40'